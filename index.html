<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Up | Growth and Healing</title>
    
    <link rel="icon" href="SELF UP.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #0D0D0D;      
            --accent: #FCD37E;       
            --accent-gradient: linear-gradient(135deg, #ffd700 0%, #ffec8b 45%, #fffacd 70%, #daa520 100%);
            --silver-gradient: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 45%, #ffffff 70%, #a0a0a0 100%);
            --text-main: #FFFFFF;
            --text-dim: #777777;     
            --transition-premium: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* --- LUXURY BACKGROUND --- */
        #bgAnim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: #050505; }
        .aura {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.12;
            animation: moveAura 20s infinite alternate ease-in-out;
        }
        .aura-1 { width: 70vw; height: 70vw; background: var(--accent); top: -10%; left: -10%; }
        .aura-2 { width: 50vw; height: 50vw; background: #444; bottom: -10%; right: -5%; animation-delay: -5s; }
        
        @keyframes moveAura {
            0% { transform: translate(0, 0); }
            100% { transform: translate(80px, 40px); }
        }

        /* --- CINEMATIC LOGO ANIMATION SECTION --- */
        .logo-wrapper {
            position: relative;
            height: 250px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            margin-bottom: 20px;
        }

        .logo-text-anim {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            text-transform: uppercase;
            position: relative;
            display: flex;
            gap: 10px;
            opacity: 0;
            letter-spacing: 2px;
            transform-style: preserve-3d;
        }

        .letter-anim { display: inline-block; position: relative; }

        .self-text {
            color: transparent;
            background: var(--silver-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .up-text {
            color: transparent;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
        }

        /* Garis Putih Horizontal (Shining Wave) */
        .shining-wave {
            position: absolute;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            z-index: 4;
            opacity: 0;
            filter: blur(2px);
        }

        /* Efek Kilatan (Light Sweep) */
        .light-sweep-anim {
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
            z-index: 5; filter: blur(10px); opacity: 0;
        }

        /* KEYFRAMES */
        @keyframes revealLogo {
            0% { opacity: 0; transform: translateZ(-200px) rotateX(-30deg); }
            100% { opacity: 1; transform: translateZ(0) rotateX(0); }
        }

        @keyframes sweepEffect {
            0% { left: -100%; opacity: 0; }
            10% { opacity: 0.8; }
            100% { left: 100%; opacity: 0; }
        }

        @keyframes shineWave {
            0% { top: 20%; opacity: 0; }
            10% { opacity: 0.6; }
            100% { top: 80%; opacity: 0; }
        }

        .animate-reveal { animation: revealLogo 2.5s cubic-bezier(0.215, 0.610, 0.355, 1) forwards; }
        .animate-sweep { animation: sweepEffect 1.8s cubic-bezier(0.45, 0.03, 0.51, 0.95) forwards; }
        .animate-wave { animation: shineWave 2s ease-in-out forwards; }

        /* --- UI ELEMENTS --- */
        .lang-switch {
            position: fixed; top: 40px; right: 40px; z-index: 1002; color: var(--accent);
            font-weight: 800; cursor: pointer; font-size: 11px; letter-spacing: 2px;
            padding: 8px 16px; border-radius: 50px; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(252, 211, 126, 0.2); backdrop-filter: blur(10px);
        }

        nav { position: fixed; top: 40px; left: 40px; z-index: 1002; }
        .menu-btn {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); color: #FFF;
            padding: 12px 28px; border-radius: 100px; cursor: pointer;
            font-weight: 400; letter-spacing: 2px; transition: var(--transition-premium);
        }
        .menu-btn:hover { background: var(--accent); color: #000; }

        .dropdown-nav {
            position: fixed; top: -100px; left: 0; width: 100%; height: auto;
            background: rgba(10, 10, 10, 0.98); border-bottom: 1px solid rgba(252, 211, 126, 0.1);
            z-index: 1001; transition: var(--transition-premium); visibility: hidden;
            padding: 120px 40px 40px; display: flex; justify-content: center; gap: 50px;
        }
        .dropdown-nav.active { top: 0; visibility: visible; }
        .dropdown-nav a { text-decoration: none; color: #888; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; transition: 0.3s; }
        .dropdown-nav a:hover { color: var(--accent); }

        .hero { height: 95vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .hero p { color: var(--accent); font-weight: 300; letter-spacing: 12px; text-transform: uppercase; font-size: 11px; margin-top: 5px; opacity: 0.7; }

        /* BENTO & OTHERS */
        .social-bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto 100px; padding: 0 25px; }
        .social-item {
            background: rgba(13, 13, 13, 0.6); padding: 40px 20px; border-radius: 30px;
            text-decoration: none; color: #FFF; border: 1px solid rgba(255,255,255,0.03);
            transition: var(--transition-premium); display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .social-item:hover { border-color: var(--accent); transform: translateY(-8px); }
        .social-item i { font-size: 22px; color: var(--accent); }
        .social-item span { font-weight: 600; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); }

        .about-box { background: #0D0D0D; padding: 80px 60px; border-radius: 50px; max-width: 1100px; margin: 100px auto; border: 1px solid rgba(255,255,255,0.02); }
        .about-box h2 { font-family: 'Playfair Display', serif; font-size: 45px; text-align: center; margin-bottom: 50px; color: #FFF; }

        @media (max-width: 768px) {
            .social-bento { grid-template-columns: repeat(2, 1fr); }
            .logo-text-anim { font-size: 3.5rem; }
            .logo-wrapper { height: 180px; }
        }
    </style>
</head>
<body>

    <div id="bgAnim">
        <div class="aura aura-1"></div>
        <div class="aura aura-2"></div>
    </div>

    <div class="lang-switch" onclick="toggleLang()" id="langBtn">ID</div>

    <nav>
        <button class="menu-btn" onclick="toggleDropdown()">DISCOVER</button>
    </nav>

    <div class="dropdown-nav" id="dropdownNav">
        <a href="#" onclick="showPage('beranda')">Home</a>
        <a href="#" onclick="showPage('about')">Philosophy</a>
        <a href="https://lynk.id/self.up" target="_blank">Store</a>
        <a href="#" onclick="toggleDropdown()" style="color:var(--accent)">× Close</a>
    </div>

    <main id="page-beranda">
        <header class="hero">
            <div class="logo-wrapper">
                <div class="shining-wave" id="wave1"></div>
                <div class="shining-wave" id="wave2" style="animation-delay: 0.5s;"></div>
                
                <div class="logo-text-anim" id="mainLogo">
                    <span class="letter-anim self-text">Self</span>
                    <span class="letter-anim up-text">Up</span>
                    <div class="light-sweep-anim" id="logoSweep"></div>
                </div>
            </div>
            <p id="heroTag">Growth and healing</p>
        </header>

        <div class="social-bento">
            <a href="https://lynk.id/self.up" target="_blank" class="social-item"><i class="fas fa-crown"></i><span>E-BOOK</span></a>
            <a href="https://www.tiktok.com/@self.up_id" target="_blank" class="social-item"><i class="fab fa-tiktok"></i><span>TIKTOK</span></a>
            <a href="https://www.youtube.com/@self.up_id" target="_blank" class="social-item"><i class="fab fa-youtube"></i><span>YOUTUBE</span></a>
            <a href="https://www.instagram.com/self.up_id/" target="_blank" class="social-item"><i class="fab fa-instagram"></i><span>INSTAGRAM</span></a>
        </div>
    </main>

    <main id="page-about" style="display: none;">
        <div class="about-box">
            <h2>Philosophy</h2>
            <div style="color: #888; text-align: center; max-width: 800px; margin: 0 auto; line-height: 2;">
                <p>Self Up adalah ruang singkat untuk berhenti, melihat langkah, dan mulai lagi dengan lebih tenang. Pelan juga tetap maju.</p>
            </div>
        </div>
    </main>

    <script>
        const mainLogo = document.getElementById('mainLogo');
        const logoSweep = document.getElementById('logoSweep');
        const wave1 = document.getElementById('wave1');
        const wave2 = document.getElementById('wave2');

        function triggerPremiumAnimation() {
            // Reset animations
            [mainLogo, logoSweep, wave1, wave2].forEach(el => {
                el.classList.remove('animate-reveal', 'animate-sweep', 'animate-wave');
                void el.offsetWidth; // Trigger reflow
            });

            // Start Sequence
            mainLogo.classList.add('animate-reveal');
            
            setTimeout(() => {
                logoSweep.classList.add('animate-sweep');
            }, 500);

            setTimeout(() => {
                wave1.classList.add('animate-wave');
                wave2.classList.add('animate-wave');
            }, 1800);
        }

        // Navigation & Logic
        function toggleDropdown() {
            document.getElementById('dropdownNav').classList.toggle('active');
        }

        function showPage(page) {
            document.getElementById('page-beranda').style.display = (page === 'beranda') ? 'block' : 'none';
            document.getElementById('page-about').style.display = (page === 'about') ? 'block' : 'none';
            document.getElementById('dropdownNav').classList.remove('active');
            if(page === 'beranda') triggerPremiumAnimation();
        }

        // Init & Loop 15s
        window.onload = () => {
            triggerPremiumAnimation();
            setInterval(triggerPremiumAnimation, 15000); 
        };
    </script>
</body>
</html>
